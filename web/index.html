<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Report Grader</title><style>
:root{color-scheme:light dark;--bg:#f5f6f8;--panel:#fff;--fg:#202a35;--muted:#626c79;--line:#d8dee6;--accent:#245d98;--hover:#eaf0f6;--log:#17212c;--logfg:#dce9e2} @media(prefers-color-scheme:dark){:root{--bg:#151a20;--panel:#20272f;--fg:#e5eaf0;--muted:#a9b5c2;--line:#414b56;--accent:#3478b8;--hover:#293747}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}header,.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{margin-bottom:18px}h1{font-size:22px;margin:0;letter-spacing:-.4px}h2{font-size:16px;margin:0 0 12px}section{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px;margin-bottom:14px}.spacer{flex:1}button,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 11px;cursor:pointer}button:hover{background:var(--hover)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}label{display:inline-flex;align-items:center;gap:6px}input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}td,th{border-bottom:1px solid var(--line);padding:8px 9px}th{font-size:12px;color:var(--muted);font-weight:600}td button{padding:4px 8px;font-size:12px}.tablewrap{overflow:auto;margin:12px 0}.muted{color:var(--muted);font-size:12px}.ok{color:#218052}.warn{color:#ad6a15}@media(prefers-color-scheme:dark){.ok{color:#80d4a7}.warn{color:#efbd77}}#log{background:var(--log);color:var(--logfg);height:300px;overflow:auto;padding:12px;border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 monospace;margin:10px 0 0}textarea{width:100%;min-height:230px;resize:vertical;font:14px/1.6 monospace;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:10px;border-radius:5px}dialog{width:min(760px,95vw);border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--fg);padding:20px}dialog::backdrop{background:#0007}#message{white-space:pre-wrap;color:var(--muted)}.error{color:#c44949!important}#joblist{font-size:13px;margin:8px 0;white-space:pre-wrap}#planText{max-height:60vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere} .nowrap{white-space:nowrap} @media(max-width:650px){main{padding:10px}section{padding:10px}}
#log .log-head{color:#9cc9fa;font-weight:700}#log .log-ok{color:#8cdaad}#log .log-warn{color:#f4cf86}#log .log-error{color:#ffaaa5}#log .log-line{display:block;min-height:1.45em;padding-left:1em;text-indent:-1em}#log .log-head{margin-top:.35em}#progress{font-variant-numeric:tabular-nums;font-weight:600}
#workarea{display:flex;gap:12px;align-items:stretch;margin-top:10px}#log{flex:1;min-width:0;height:560px;margin:0}#previewPanel{width:38%;min-width:180px;max-width:70%;resize:horizontal;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:8px;height:560px;direction:rtl}#previewPanel>*{direction:ltr}#previewPanel[hidden]{display:none}#previewImage{display:block;max-width:100%;max-height:440px;margin:8px auto;cursor:zoom-in}#previewImage:not([src]){display:none}#previewName{overflow-wrap:anywhere}#largeImage{max-width:100%;display:block;margin:auto}#zoomDialog{width:min(1000px,95vw);max-height:95vh;overflow:auto}@media(max-width:650px){#workarea{display:block}#previewPanel{width:100%;max-width:100%;resize:none;height:auto;margin-top:10px}#log{height:350px}}
</style></head><body><main><header><h1>PDF Report Grader</h1><span class="muted">ローカル採点支援</span><span class="spacer"></span><button id="refresh">再読み込み</button></header>
<section><div class="bar"><label>クラス <select id="cls"></select></label><span class="spacer"></span><label><input type="checkbox" id="all">表示中の課題を全選択</label></div><div class="tablewrap"><table><thead><tr><th>選択</th><th>課題</th><th>提出データ</th><th>状態</th><th>採点基準</th><th>結果</th></tr></thead><tbody id="rows"></tbody></table></div><div class="bar"><label><input type="checkbox" id="grading" checked>AI採点</label><span class="spacer"></span><span id="count" class="muted"></span><button id="planBtn">採点プラン確認・生成</button><button id="start" class="primary">処理開始</button></div><p id="message" role="status"></p><div class="muted">入力: in/&lt;クラス&gt;/DATA_wXX_*.zip　出力: out/&lt;クラス&gt;/　再実行時は既存XLSXをバックアップします．</div></section>
<section><div class="bar"><h2>処理状況</h2><span class="spacer"></span><span id="progress" aria-live="polite"></span><button id="stop" disabled>中断</button><label><input id="follow" type="checkbox" checked>自動スクロール</label></div><div id="joblist"></div><label><input id="showPreview" type="checkbox" checked>PDFプレビュー</label><div id="workarea"><pre id="log" aria-label="処理ログ"></pre><aside id="previewPanel"><div class="bar"><strong>PDFプレビュー</strong><span class="spacer"></span><label><input id="autoPage" type="checkbox" checked>ページ追従</label></div><div id="previewName" class="muted"></div><div class="bar"><button id="prevPage" disabled>前</button><span id="pageNum">―</span><button id="nextPage" disabled>次</button><span class="spacer"></span><button id="zoom" disabled>拡大</button></div><div id="previewStatus" class="muted">処理中のPDFを表示します．</div><img id="previewImage" alt="処理中のPDF"></aside></div><p class="muted">ブラウザを閉じてもサーバが起動中であれば処理を継続します．中断時は処理途中のファイルが残ることがあります．</p></section>
<dialog id="editor"><h2 id="editTitle">採点基準</h2><p class="muted">同じ演習回の採点基準は全クラスで共用します．</p><textarea id="rubric"></textarea><div class="bar"><span class="spacer"></span><button id="closeEdit">閉じる</button><button class="primary" id="saveEdit">保存</button></div></dialog><dialog id="planDialog"><h2>採点プラン</h2><pre id="planText"></pre><button id="closePlan">閉じる</button></dialog><dialog id="zoomDialog"><div class="bar"><strong>PDF拡大表示</strong><span class="spacer"></span><button id="closeZoom">閉じる</button></div><img id="largeImage" alt="PDF拡大表示"></dialog></main><script>
const token='__LOCAL_TOKEN__', $=id=>document.getElementById(id);let tasks=[],selected=new Set(),active=false,cursor=0,generation=-1,editId='',polling=false;
async function api(path,method='GET',data){const res=await fetch('/api/'+path,{method,headers:{'X-Local-Token':token,'Content-Type':'application/json'},...(data===undefined?{}:{body:JSON.stringify(data)})});if(!res.ok){let e;try{e=await res.json()}catch{}throw Error(e?.detail||`HTTP ${res.status}`)}return res.json()}
let logText='';
function clearLog(){logText='';$('log').replaceChildren()}
function appendLog(chunk){
 const el=$('log'),top=el.scrollTop;logText=(logText+chunk);if(logText.length>250000){const cut=logText.indexOf('\n',logText.length-250000);logText=cut<0?logText.slice(-250000):logText.slice(cut+1)}
 const frag=document.createDocumentFragment();for(const line of logText.split('\n')){const span=document.createElement('span');span.className='log-line';span.textContent=line||' ';
 if(/^(PDF解析|AI採点|===)/.test(line))span.classList.add('log-head');
 else if(/^\s*(FAIL\s|結果: INVALID|VLM ERROR|実行失敗)/.test(line))span.classList.add('log-error');
 else if(/^\s*(REVIEW\s|NEED_IMAGE|結果: REVIEW|.*retry |Grading warning:)/.test(line)||/^\s*AI点数: .*\(REVIEW\)/.test(line))span.classList.add('log-warn');
 else if(/^\s*(PASS\s|結果: VALID)/.test(line)||/^\s*AI点数: .*\(OK\)/.test(line))span.classList.add('log-ok');frag.append(span)}
 el.replaceChildren(frag);el.scrollTop=$('follow').checked?el.scrollHeight:top;
}
function msg(s,err=false){$('message').textContent=s;$('message').className=err?'error':''}
function button(label,action,disabled=false){const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=async()=>{try{await action()}catch(e){msg(e.message,true)}};return b}
function cell(tr,text){const td=tr.insertCell();if(text!==undefined)td.textContent=text;return td}
function shown(){return tasks.filter(t=>$('cls').value==='*'||t.cls===$('cls').value)}
function controls(){const list=shown().filter(t=>t.ready);$('all').checked=list.length>0&&list.every(t=>selected.has(t.id));$('all').indeterminate=list.some(t=>selected.has(t.id))&&!$('all').checked;$('all').disabled=active;const hidden=selected.size-shown().filter(t=>selected.has(t.id)).length;$('count').textContent=`${selected.size} 課題を選択中${hidden?'（他クラス '+hidden+'）':''}`;$('start').disabled=active||!selected.size;$('planBtn').disabled=active||!selected.size||!$('grading').checked;$('grading').disabled=active;$('stop').disabled=!active}
function render(){const body=$('rows');body.replaceChildren();for(const t of shown()){const tr=body.insertRow(),cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(t.id);cb.disabled=active||!t.ready;cb.setAttribute('aria-label',t.cls+' '+t.week);cb.onchange=()=>{cb.checked?selected.add(t.id):selected.delete(t.id);controls()};cell(tr).append(cb);cell(tr,t.cls+' / '+t.week);cell(tr,t.name+(t.directory?'（展開済み）':'.zip'));const st=cell(tr,!t.ready?'雛形なし':t.done?'結果あり':t.plan?'プランあり':'未処理');st.className=t.done?'ok':!t.ready?'warn':'';const rb=cell(tr);rb.append(button(t.rubric_exists?'編集':'作成',async()=>{editId=t.id;$('editTitle').textContent='grading_'+t.week+'.txt';$('rubric').value=(await api('rubric?id='+encodeURIComponent(t.id))).text;$('editor').showModal()},active));const result=cell(tr);result.append(button('XLSX',()=>api('open?id='+encodeURIComponent(t.id)+'&kind=xlsx','POST'),!t.done), ' ',button('フォルダ',()=>api('open?id='+encodeURIComponent(t.id)+'&kind=folder','POST'),!t.done&&!t.plan&&!t.directory),' ',button('プラン',async()=>{$('planText').textContent=(await api('plan?id='+encodeURIComponent(t.id))).text;$('planDialog').showModal()},!t.plan))}if(!shown().length){const tr=body.insertRow();const td=cell(tr,'対象データがありません．in/ に名簿・雛形・提出ZIPを配置してください．');td.colSpan=6}controls()}
async function refresh(){tasks=await api('tasks');selected=new Set([...selected].filter(id=>tasks.some(t=>t.id===id&&t.ready)));const old=$('cls').value;$('cls').replaceChildren(new Option('すべて','*'),...[...new Set(tasks.map(t=>t.cls))].map(c=>new Option(c,c)));$('cls').value=[...$('cls').options].some(o=>o.value===old)?old:'*';render()}
async function start(plan){const rows=tasks.filter(t=>selected.has(t.id));if(!plan&&rows.some(t=>t.done)&&!confirm('既存の結果を再処理します．点数・備考はバックアップに残りますが，新しいXLSXへ自動転記されません．続行しますか？'))return;await api('start','POST',{ids:rows.map(t=>t.id),grading:$('grading').checked,plan_only:plan});clearLog();active=true;render();msg('処理を開始しました．');await poll()}
let preview=null,manualPage=1,previewKey='',previewURL='',previewRequest=0,previewAbort=null,largeURL='',zoomRequest=0;
function clearPreview(){previewRequest++;previewAbort?.abort();previewKey='';$('previewImage').removeAttribute('src');if(previewURL)URL.revokeObjectURL(previewURL);previewURL='';$('previewName').textContent='';$('pageNum').textContent='―';$('previewStatus').textContent='処理中のPDFを表示します．';for(const id of ['prevPage','nextPage','zoom'])$(id).disabled=true;}
async function imageBlob(p,page,large,signal){const r=await fetch(`/api/preview?id=${p.id}&page=${page}&large=${large}`,{headers:{'X-Local-Token':token},signal});if(!r.ok)throw Error('プレビュー取得不可');return r.blob()}
function updatePreview(p){if(p?.id!==preview?.id){zoomRequest++;manualPage=p?.page||1;clearPreview();if($('zoomDialog').open)$('zoomDialog').close()}preview=p;if(!p||!$('showPreview').checked){clearPreview();return}const page=$('autoPage').checked?p.page:manualPage;manualPage=Math.max(1,Math.min(p.count,page));$('previewName').textContent=p.name;$('pageNum').textContent=`${manualPage} / ${p.count}`;$('prevPage').disabled=manualPage<=1;$('nextPage').disabled=manualPage>=p.count;$('zoom').disabled=false;const key=`${p.id}:${manualPage}`;if(key===previewKey)return;previewKey=key;const request=++previewRequest;previewAbort?.abort();previewAbort=new AbortController();$('previewImage').removeAttribute('src');$('previewStatus').textContent='読み込み中…';imageBlob(p,manualPage,false,previewAbort.signal).then(blob=>{if(request!==previewRequest)return;if(previewURL)URL.revokeObjectURL(previewURL);previewURL=URL.createObjectURL(blob);$('previewImage').src=previewURL;$('previewStatus').textContent=''}).catch(e=>{if(request===previewRequest){$('previewStatus').textContent=e.message;previewKey=''}})}
function movePage(delta){if(!preview)return;$('autoPage').checked=false;manualPage=Math.max(1,Math.min(preview.count,manualPage+delta));updatePreview(preview)}
$('prevPage').onclick=()=>movePage(-1);$('nextPage').onclick=()=>movePage(1);$('autoPage').onchange=()=>updatePreview(preview);$('showPreview').onchange=()=>{$('previewPanel').hidden=!$('showPreview').checked;updatePreview(preview)};
async function zoom(){if(!preview)return;const req=++zoomRequest;try{const blob=await imageBlob(preview,manualPage,true);if(req!==zoomRequest)return;if(largeURL)URL.revokeObjectURL(largeURL);largeURL=URL.createObjectURL(blob);$('largeImage').src=largeURL;$('zoomDialog').showModal()}catch(e){msg(e.message,true)}}$('zoom').onclick=zoom;$('previewImage').onclick=zoom;$('closeZoom').onclick=()=>$('zoomDialog').close();$('zoomDialog').onclose=()=>{zoomRequest++;$('largeImage').removeAttribute('src');if(largeURL)URL.revokeObjectURL(largeURL);largeURL=''};
async function poll(){if(polling)return;polling=true;try{const s=await api('state?after='+cursor),old=active;active=s.active;cursor=s.cursor;updatePreview(s.preview);if(generation!==s.generation){generation=s.generation;clearLog()}$('progress').textContent=s.progress|| (active?'実行中':'待機中');$('joblist').textContent=s.items.map(t=>t.id+'：'+({queued:'待機',running:'実行中',done:'完了',error:'失敗',cancelled:'中断'}[t.status]||t.status)).join('\n');if(s.logs.length){appendLog(s.logs.map(l=>l.text).join(''))}if(old!==active){if(!active){await refresh();msg(s.items.some(t=>t.status==='error')?'一部の処理が失敗しました．ログを確認してください．':s.items.some(t=>t.status==='cancelled')?'処理を中断しました．':'処理が完了しました．')}else render()}controls()}catch(e){msg(e.message,true)}finally{polling=false}}
function handle(fn){return async()=>{try{await fn()}catch(e){msg(e.message,true)}}}$('refresh').onclick=handle(refresh);$('cls').onchange=render;$('all').onchange=()=>{for(const t of shown().filter(t=>t.ready))$('all').checked?selected.add(t.id):selected.delete(t.id);render()};$('grading').onchange=controls;$('start').onclick=handle(()=>start(false));$('planBtn').onclick=handle(()=>start(true));$('stop').onclick=handle(async()=>{if(confirm('実行中の処理と残りの課題を中断しますか？'))await api('stop','POST')});$('closeEdit').onclick=()=>$('editor').close();$('closePlan').onclick=()=>$('planDialog').close();$('saveEdit').onclick=handle(async()=>{await api('rubric?id='+encodeURIComponent(editId),'PUT',{text:$('rubric').value});$('editor').close();await refresh();msg('採点基準を保存しました．')});handle(async()=>{await refresh();await poll()})();setInterval(poll,700);
</script></body></html>
